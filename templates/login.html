<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish — VERIFIK PRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #f8fafc; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .logo { text-align: center; font-size: 26px; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #cbd5e1; }
        input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        .error { background: #7f1d1d; color: #fecaca; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">VERIFIK PRO</div>
        <div class="subtitle">Kompaniya boshqaruv paneliga kirish</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Login (Foydalanuvchi nomi)</label>
                <input type="text" name="username" required placeholder="Loginni kiriting">
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit">Kirish</button>
        </form>
        <a href="/" class="back-link">← Bosh sahifaga qaytish</a>
    </div>

</body>
</html>
